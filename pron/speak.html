<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161E" media="(prefers-color-scheme: dark)">
<title>スピーキング — TOEIC900 道場</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root {
  /* Same tokens as the dojo. One screen: the partner's line on top, one big record button, the transcript below,
     and a single primary action that carries the transcript back to the dojo for correction. */
  --bg: #F2F3F5; --surface: #FFFFFF; --ink: #1C2230; --ink-2: #5B6473; --line: #DCE0E7;
  --gold: #B8901C; --gold-ink: #7E6110; --gold-soft: #F6ECCB;
  --good: #2E7D4F; --good-soft: #DDF0E4; --bad: #B23A3A; --bad-soft: #F6DEDE;
  --shadow: 0 1px 2px rgba(28,34,48,.05), 0 8px 22px rgba(28,34,48,.07);
  --font-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-en: "Newsreader", "Georgia", "Times New Roman", serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161E; --surface: #1B212C; --ink: #E9ECF2; --ink-2: #9AA3B2; --line: #2B3342;
  --gold: #D9B341; --gold-ink: #E6C65C; --gold-soft: #3A3217;
  --good: #5FBF85; --good-soft: #1E3A2A; --bad: #E07070; --bad-soft: #42232A;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #12161E; --surface: #1B212C; --ink: #E9ECF2; --ink-2: #9AA3B2; --line: #2B3342;
  --gold: #D9B341; --gold-ink: #E6C65C; --gold-soft: #3A3217;
  --good: #5FBF85; --good-soft: #1E3A2A; --bad: #E07070; --bad-soft: #42232A;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
button, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font-weight: 700; white-space: nowrap; }
.brand small { color: var(--gold-ink); font-weight: 500; margin-left: 6px; font-size: 12px; }
main { padding-block: 14px calc(env(safe-area-inset-bottom, 0px) + 28px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h2 { font-size: 18px; margin: 0; font-weight: 700; text-wrap: balance; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; box-shadow: var(--shadow); }
.muted { color: var(--ink-2); font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 16px; font-weight: 600; min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: var(--ink); text-decoration: none; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #1C1A10; font-weight: 700; box-shadow: 0 6px 16px rgba(184,144,28,.28); }
.btn.block { width: 100%; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 13px; border-radius: 999px; }
.btn.ghost { background: var(--bg); border-color: transparent; color: var(--gold-ink); }
.btn:disabled { opacity: .5; cursor: default; box-shadow: none; }
.pill { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 999px; background: var(--gold-soft); color: var(--gold-ink); font-weight: 700; letter-spacing: .04em; }
.partner { font-family: var(--font-en); font-size: 22px; line-height: 1.4; background: var(--bg); border-radius: 14px; padding: 12px 14px; }
.partner small { display: block; font-family: var(--font-ui); font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
.heard { font-family: var(--font-en); font-size: 19px; line-height: 1.45; min-height: 3em; border: 1px dashed var(--line); border-radius: 14px; padding: 12px 14px; text-align: left; }
.heard.live { border-color: var(--bad); }
.rec { border: 0; background: var(--gold); color: #1C1A10; width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; margin: 4px auto; box-shadow: 0 10px 24px rgba(184,144,28,.35); }
.rec svg.i { width: 40px; height: 40px; }
.rec.live { background: var(--bad); color: #fff; animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(178,58,58,.45); } 50% { box-shadow: 0 0 0 14px rgba(178,58,58,0); } }
.banner { background: var(--bad-soft); color: var(--bad); border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.6; }
.center { text-align: center; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 9; max-width: 90vw; }
#toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<svg hidden xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21M9 21h6"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
</svg>
<header class="top">
  <div class="brand">スピーキング<small>TOEIC900 道場</small></div>
  <button id="hdDojo" class="btn small ghost" type="button"><svg class="i"><use href="#i-back"/></svg>道場へ</button>
</header>
<main>
  <div id="noSr" class="banner" hidden><b>この環境では音声認識が使えません。</b> iPhoneの Safari で開き、設定で Siri と音声入力をオンにしてください。</div>
  <div id="noData" class="banner" hidden>お題を読み込めませんでした。電波の良い場所で開き直してください。</div>
  <section class="card">
    <div class="row"><span class="pill" id="spCatPill">お題</span><select id="spCat" class="btn small"><option value="all">日常 + ビジネス</option><option value="daily">日常会話</option><option value="biz">ビジネス会話</option></select><span class="grow"></span><button id="spNext" class="btn small" type="button">別のお題</button></div>
    <div class="muted" id="spScene"></div>
    <div class="partner"><small>相手のセリフ</small><span id="spPartner"></span></div>
    <div class="row"><button id="spSay" class="btn small ghost" type="button"><svg class="i"><use href="#i-play"/></svg>相手のセリフを聞く</button><span class="muted" id="spHint"></span></div>
    <div class="center"><button id="spRec" class="rec" type="button" aria-label="録音"><svg class="i"><use href="#i-mic"/></svg></button><div class="muted" id="spStatus">タップして、会話で返すように話す (止めるときにもう一度タップ)</div></div>
    <div class="heard" id="spHeard"></div>
    <div class="row"><button id="spRetry" class="btn small" type="button" disabled>言い直す</button><span class="grow"></span><span class="muted">聞き取った英文は編集せず、そのまま添削に出します</span></div>
    <button id="spGo" class="btn primary block" type="button" disabled>道場で添削してもらう</button>
    <div class="muted">道場(claude.ai)が開き、ネイティブならどう返すかと、直すべき点が出ます。</div>
  </section>
</main>
<div id="toast" role="status"></div>
<script>
(() => {
"use strict";
const DOJO = "https://claude.ai/artifact/QZtNddSesjApxVJzisJRj6";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let toastT; const toast = (m) => { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2800); };
const LS = "toeic900.speak";
let st = { cat: "all", pos: {}, done: 0 };
try { const j = JSON.parse(localStorage.getItem(LS) || "null"); if (j && typeof j === "object") st = Object.assign(st, j); } catch (e) {}
const saveSt = () => { try { localStorage.setItem(LS, JSON.stringify(st)); } catch (e) {} };

let ALL = [], cur = null, text = "";
function pool() { return st.cat === "all" ? ALL : ALL.filter((p) => p.cat === st.cat); }
function pick(advance) {
  const P = pool(); if (!P.length) return null;
  const k = st.cat; st.pos[k] = ((st.pos[k] || 0) + (advance ? 1 : 0)) % P.length; saveSt();
  return P[st.pos[k]];
}
function render() {
  if (!cur) return;
  $("spCat").value = st.cat; $("spCatPill").textContent = cur.cat === "biz" ? "ビジネス" : "日常";
  $("spScene").textContent = cur.scene; $("spPartner").textContent = cur.partner; $("spHint").textContent = cur.hint ? "ヒント: " + cur.hint : "";
  text = ""; $("spHeard").textContent = ""; $("spHeard").classList.remove("live"); $("spGo").disabled = true; $("spRetry").disabled = true;
  $("spStatus").textContent = "タップして、会話で返すように話す (止めるときにもう一度タップ)";
}
function speak(s) {
  if (!("speechSynthesis" in window)) return toast("この端末では読み上げできません");
  const u = new SpeechSynthesisUtterance(s); u.lang = "en-US"; u.rate = 1.0;
  const v = speechSynthesis.getVoices().find((x) => x.lang === "en-US"); if (v) u.voice = v;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
const b64url = (s) => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

/* speech recognition: continuous, up to 40 s, stopped by a second tap */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let rec = null, live = false, recTimer = null, finalText = "";
function startRec() {
  if (!SR) return;
  try { if (rec) { rec.onresult = rec.onerror = rec.onend = null; rec.abort(); } } catch (e) {}
  rec = new SR(); rec.lang = "en-US"; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 1;
  finalText = ""; live = true; $("spRec").classList.add("live"); $("spRec").innerHTML = '<svg class="i"><use href="#i-stop"/></svg>'; $("spHeard").classList.add("live"); $("spHeard").textContent = ""; $("spStatus").textContent = "聞いています... 話し終えたらタップ"; $("spGo").disabled = true;
  rec.onresult = (ev) => {
    let f = "", i = "";
    for (let k = 0; k < ev.results.length; k++) { const r = ev.results[k]; if (r.isFinal) f += r[0].transcript + " "; else i += r[0].transcript + " "; }
    finalText = f.trim(); $("spHeard").textContent = (f + i).trim();
  };
  rec.onerror = (ev) => { const w = (ev && ev.error) || "error"; if (w !== "aborted" && w !== "no-speech") toast("認識エラー: " + w); if (w === "not-allowed" || w === "service-not-allowed") $("noSr").hidden = false; };
  rec.onend = () => { if (live) stopRec(); };
  try { rec.start(); } catch (e) { toast("録音を開始できませんでした"); stopRec(); }
  clearTimeout(recTimer); recTimer = setTimeout(() => { if (live) stopRec(); }, 40000);
}
function stopRec() {
  live = false; clearTimeout(recTimer);
  try { if (rec) rec.stop(); } catch (e) {}
  $("spRec").classList.remove("live"); $("spRec").innerHTML = '<svg class="i"><use href="#i-mic"/></svg>'; $("spHeard").classList.remove("live");
  text = (finalText || $("spHeard").textContent || "").trim();
  if (text) { $("spHeard").textContent = text; $("spGo").disabled = false; $("spRetry").disabled = false; $("spStatus").textContent = "これでよければ「道場で添削してもらう」"; }
  else { $("spStatus").textContent = "聞き取れませんでした。もう一度タップして話してください"; }
}
$("spRec").addEventListener("click", () => { if (!SR) { $("noSr").hidden = false; return; } if (live) stopRec(); else { speechSynthesis && speechSynthesis.cancel(); startRec(); } });
$("spRetry").addEventListener("click", () => { text = ""; $("spHeard").textContent = ""; $("spGo").disabled = true; $("spRetry").disabled = true; });
/* The partner line has a recording (speak_prompts.json: files + f/s/e); the media fragment plays just that span.
   Device speech synthesis is only the fallback. */
let FILES = {}; const player = new Audio();
$("spSay").addEventListener("click", () => {
  if (cur && cur.f && FILES[cur.f] && cur.s != null) {
    try { player.pause(); player.src = "../app/" + FILES[cur.f] + "#t=" + Math.max(0, cur.s - 0.15).toFixed(2) + "," + (cur.e + 0.12).toFixed(2); const p = player.play(); if (p && p.catch) p.catch(() => speak(cur.partner)); return; } catch (e) {}
  }
  speak(cur.partner);
});
$("spNext").addEventListener("click", () => { if (live) stopRec(); cur = pick(true); render(); });
$("spCat").addEventListener("change", () => { st.cat = $("spCat").value; saveSt(); cur = pick(false); render(); });
/* The transcript travels to the dojo in the URL hash (#sp.<id>.<base64url>), the only channel the dojo page can read. */
$("spGo").addEventListener("click", () => {
  if (!text) return;
  st.done++; saveSt();
  location.href = DOJO + "#sp." + cur.id + "." + b64url(text.slice(0, 600));
});
$("hdDojo").addEventListener("click", () => { location.href = DOJO; });
(async () => {
  if (!SR) $("noSr").hidden = false;
  try { const r = await fetch("../app/speak_prompts.json"); if (!r.ok) throw new Error(r.status); const j = await r.json(); ALL = j.prompts || []; FILES = j.files || {}; } catch (e) { $("noData").hidden = false; return; }
  const want = /[?&]p=(s\d+)/.exec(location.search);
  cur = want ? (ALL.find((p) => p.id === want[1]) || pick(false)) : pick(false);
  render();
  if ("speechSynthesis" in window) speechSynthesis.getVoices();
})();
})();
</script>
</body>
</html>
